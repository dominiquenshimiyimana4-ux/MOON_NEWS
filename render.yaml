services:
  - type: web
    name: moon-news-backend
    runtime: node
    plan: free
    rootDir: backend
    autoDeployTrigger: checksPass
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://moon-news.moonn.workers.dev
      - key: ADMIN_NAME
        value: Moon News Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTHOR_NAME
        value: Moon News Author
      - key: AUTHOR_EMAIL
        sync: false
      - key: AUTHOR_PASSWORD
        sync: false
      - key: ADVERTISER_NAME
        value: Moon News Advertiser
      - key: ADVERTISER_EMAIL
        sync: false
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: ADVERTISER_PASSWORD
        sync: false
    # Configure generated secrets and provision accounts after first deploy.
    # Payments remain unavailable until Flutterwave credentials are configured.