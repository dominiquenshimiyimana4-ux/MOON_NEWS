services:
  - type: web
    name: moon-news-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://moon-news.moonn.workers.dev
      - key: ADMIN_NAME
        value: Moon News Administrator
      - key: ADMIN_EMAIL
        value: dominiquenshimiyimana4@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTHOR_NAME
        value: Moon News Author
      - key: AUTHOR_EMAIL
        value: authormoonnews@gmail.com
      - key: AUTHOR_PASSWORD
        sync: false
      - key: ADVERTISER_NAME
        value: Moon News Advertiser
      - key: ADVERTISER_EMAIL
        value: advertisermoonnews@gmail.com
      - key: ADVERTISER_PASSWORD
        sync: false
    # Run provision after first deploy via Render shell:
    # npm run provision:auth